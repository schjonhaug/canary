# Regtest configuration based on easy-fulcrum
regtest=1
txindex=1
server=1
rpcbind=0.0.0.0:18443
rpcuser=bitcoin
rpcpassword=bitcoin
disablewallet=0
fallbackfee=0.00001
printtoconsole=1
persistmempool=0

# Allow connections from other Docker containers (needed by NBXplorer)
rpcallowip=0.0.0.0/0

# ZMQ notifications for NBXplorer (if compiled with ZMQ support, otherwise silently ignored)
zmqpubrawblock=tcp://0.0.0.0:28332
zmqpubrawtx=tcp://0.0.0.0:28333