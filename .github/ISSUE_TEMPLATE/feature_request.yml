name: Feature request
description: Suggest an idea or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. If it depends on a specific setup, tell us which version you are running and where.
  - type: input
    id: version
    attributes:
      label: Canary version
      description: Which version of Canary are you running? Check the footer in Canary, or the app version shown by Start9, Umbrel, or MyNode.
      placeholder: e.g. 1.5.0
    validations:
      required: false
  - type: dropdown
    id: install-location
    attributes:
      label: Where are you running Canary?
      options:
        - Start9
        - Umbrel
        - MyNode
        - Completely self-hosted
        - canarybitcoin.com
        - Other
    validations:
      required: false
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: Describe the feature and why it would help.
    validations:
      required: true
