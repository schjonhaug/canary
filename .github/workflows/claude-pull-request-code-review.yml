name: Claude Code Review

on:
  pull_request:
    types: [opened, reopened]

concurrency:
  group: 'claude-review-${{ github.event.pull_request.number }}'
  cancel-in-progress: true

jobs:
  claude-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          use_sticky_comment: true
          trigger_phrase: ""
          prompt: |
            Please review this pull request and provide feedback on:
            - Code quality and best practices
            - Potential bugs or issues
            - Performance considerations
            - Security concerns
            - Test coverage

            Be constructive and helpful in your feedback.
            Format your response in markdown.

      - name: Post Claude feedback (fallback)
        if: always() && steps.claude-review.outputs.execution_file != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const execFile = '${{ steps.claude-review.outputs.execution_file }}';

            if (!fs.existsSync(execFile)) {
              console.log('No execution file found, skipping fallback comment');
              return;
            }

            const data = JSON.parse(fs.readFileSync(execFile, 'utf8'));

            // Find the assistant's final response
            let reviewContent = '';
            if (data.messages) {
              for (const msg of data.messages.reverse()) {
                if (msg.role === 'assistant' && msg.content) {
                  for (const block of msg.content) {
                    if (block.type === 'text') {
                      reviewContent = block.text;
                      break;
                    }
                  }
                  if (reviewContent) break;
                }
              }
            }

            if (!reviewContent) {
              console.log('No review content found in execution file');
              return;
            }

            // Check if a Claude comment already exists
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });

            const claudeComment = comments.find(c =>
              c.body && c.body.includes('Claude Code Review')
            );

            const header = '## 🤖 Claude Code Review\n\n';
            const body = header + reviewContent;

            if (claudeComment) {
              console.log('Claude comment already exists, skipping fallback');
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: body,
              });
              console.log('Posted Claude review as fallback comment');
            }
