name: Claude Code Review

on:
  pull_request:
    types: [opened, reopened]

concurrency:
  group: 'claude-review-${{ github.event.pull_request.number }}'
  cancel-in-progress: true

jobs:
  claude-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          use_sticky_comment: true
          prompt: |
            Please review this pull request and provide feedback on:
            - Code quality and best practices
            - Potential bugs or issues
            - Performance considerations
            - Security concerns
            - Test coverage

            Be constructive and helpful in your feedback.
            Format your response in markdown.

      - name: Extract and post review
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const execFile = '/home/runner/work/_temp/claude-execution-output.json';

            if (!fs.existsSync(execFile)) {
              console.log('No execution file found');
              return;
            }

            const raw = fs.readFileSync(execFile, 'utf8');
            const lines = raw.trim().split('\n');

            // Find text blocks from assistant messages
            let reviewParts = [];
            for (const line of lines) {
              try {
                const obj = JSON.parse(line);
                if (obj.type === 'assistant' && obj.message?.content) {
                  for (const block of obj.message.content) {
                    if (block.type === 'text' && block.text) {
                      reviewParts.push(block.text);
                    }
                  }
                }
              } catch (e) {
                // Skip non-JSON lines
              }
            }

            if (reviewParts.length === 0) {
              console.log('No review content found');
              return;
            }

            // Use the last substantive review
            const reviewContent = reviewParts[reviewParts.length - 1];

            // Check for existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });

            const existingComment = comments.find(c =>
              c.body?.includes('🤖 Claude Code Review')
            );

            const body = '## 🤖 Claude Code Review\n\n' + reviewContent;

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: body,
              });
              console.log('Updated existing Claude comment');
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: body,
              });
              console.log('Created new Claude comment');
            }
