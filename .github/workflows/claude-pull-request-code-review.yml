name: Claude Code Review

on:
  pull_request:
    types: [opened, reopened]

concurrency:
  group: 'claude-review-${{ github.event.pull_request.number }}'
  cancel-in-progress: true

jobs:
  claude-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          use_sticky_comment: true
          prompt: |
            Please review this pull request and provide feedback on:
            - Code quality and best practices
            - Potential bugs or issues
            - Performance considerations
            - Security concerns
            - Test coverage

            Be constructive and helpful in your feedback.
            Format your response in markdown.

      - name: Debug execution file
        if: always()
        run: |
          EXEC_FILE="/home/runner/work/_temp/claude-execution-output.json"
          if [ -f "$EXEC_FILE" ]; then
            echo "=== Execution file exists ==="
            echo "File size: $(wc -c < "$EXEC_FILE")"
            echo "Line count: $(wc -l < "$EXEC_FILE")"
            echo "=== First 50 lines ==="
            head -50 "$EXEC_FILE"
            echo "=== Last 20 lines ==="
            tail -20 "$EXEC_FILE"
          else
            echo "Execution file not found"
          fi

      - name: Extract and post review
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const execFile = '/home/runner/work/_temp/claude-execution-output.json';

            if (!fs.existsSync(execFile)) {
              console.log('No execution file found');
              return;
            }

            const raw = fs.readFileSync(execFile, 'utf8');
            console.log('File size:', raw.length);

            // Try to find any text content in the file
            let reviewContent = '';

            // Method 1: Parse as JSONL and look for text blocks
            const lines = raw.trim().split('\n');
            console.log('Line count:', lines.length);

            for (const line of lines) {
              try {
                const obj = JSON.parse(line);

                // Check various possible structures
                if (obj.message?.content) {
                  for (const block of obj.message.content) {
                    if (block.type === 'text' && block.text) {
                      console.log('Found text block, length:', block.text.length);
                      reviewContent = block.text;
                    }
                  }
                }

                // Also check for content array directly
                if (Array.isArray(obj.content)) {
                  for (const block of obj.content) {
                    if (block.type === 'text' && block.text) {
                      console.log('Found direct text block, length:', block.text.length);
                      reviewContent = block.text;
                    }
                  }
                }
              } catch (e) {
                // Skip non-JSON lines
              }
            }

            // Method 2: If no JSONL content found, try parsing as single JSON
            if (!reviewContent) {
              try {
                const data = JSON.parse(raw);
                console.log('Parsed as single JSON, keys:', Object.keys(data));

                // Check for messages array
                if (Array.isArray(data.messages)) {
                  for (const msg of data.messages) {
                    if (msg.role === 'assistant' && Array.isArray(msg.content)) {
                      for (const block of msg.content) {
                        if (block.type === 'text' && block.text) {
                          reviewContent = block.text;
                        }
                      }
                    }
                  }
                }
              } catch (e) {
                console.log('Not valid single JSON');
              }
            }

            if (!reviewContent) {
              console.log('No review content found after all parsing attempts');
              return;
            }

            console.log('Found review content, length:', reviewContent.length);

            // Check for existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });

            const existingComment = comments.find(c =>
              c.body?.includes('🤖 Claude Code Review')
            );

            const body = '## 🤖 Claude Code Review\n\n' + reviewContent;

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: body,
              });
              console.log('Updated existing Claude comment');
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: body,
              });
              console.log('Created new Claude comment');
            }
