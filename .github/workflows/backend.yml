name: Backend

on:
  push:
    branches: ["master"]
    paths-ignore:
      - "frontend/**"
      - "scripts/**"
      - "*.md"
  pull_request:
    branches: ["master"]
    paths-ignore:
      - "frontend/**"
      - "scripts/**"
      - "*.md"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('backend/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cd backend && cargo fmt --check

      - name: Run clippy
        run: cd backend && cargo clippy -- -D warnings

      - name: Build
        run: cd backend && cargo build --verbose

      - name: Run tests
        run: cd backend && cargo test --verbose -- --test-threads=1
