name: Gemini Code Review

on:
  pull_request:
    types: [opened, reopened]

jobs:
  gemini-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff
        id: diff
        run: |
          git fetch origin ${{ github.base_ref }}
          DIFF=$(git diff origin/${{ github.base_ref }}...HEAD)
          echo "diff<<EOF" >> $GITHUB_OUTPUT
          echo "$DIFF" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Run Gemini Code Review
        id: gemini
        uses: google-github-actions/run-gemini-cli@v0.1.18
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          prompt: |
            Review this pull request diff and provide feedback on:
            - Code quality and best practices
            - Potential bugs or issues
            - Performance considerations
            - Security concerns
            - Test coverage

            Be constructive and helpful in your feedback.

            Here is the diff:
            ```
            ${{ steps.diff.outputs.diff }}
            ```

      - name: Post Gemini feedback
        if: steps.gemini.outputs.summary != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const header = '## 🤖 Gemini Code Review\n\n';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: header + process.env.GEMINI_SUMMARY,
            });
        env:
          GEMINI_SUMMARY: ${{ steps.gemini.outputs.summary }}
