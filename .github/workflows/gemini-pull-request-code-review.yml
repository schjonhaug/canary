name: Gemini Code Review

on:
  pull_request:
    types: [opened, reopened]

concurrency:
  group: 'gemini-review-${{ github.event.pull_request.number }}'
  cancel-in-progress: true

jobs:
  gemini-review:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Gemini PR Review
        id: gemini
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          workflow_name: 'gemini-review'
          settings: |
            {
              "mcpServers": {
                "github": {
                  "command": "docker",
                  "args": [
                    "run", "-i", "--rm",
                    "-e", "GITHUB_PERSONAL_ACCESS_TOKEN",
                    "ghcr.io/github/github-mcp-server:v0.18.0"
                  ],
                  "includeTools": [
                    "pull_request_read"
                  ],
                  "env": {
                    "GITHUB_PERSONAL_ACCESS_TOKEN": "${GITHUB_TOKEN}"
                  }
                }
              }
            }
          prompt: '/gemini-review'

      - name: Post Gemini review
        if: steps.gemini.outputs.summary != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const header = '## 💎 Gemini Code Review\n\n';
            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              body: header + process.env.GEMINI_SUMMARY,
              event: 'COMMENT'
            });
        env:
          GEMINI_SUMMARY: ${{ steps.gemini.outputs.summary }}
