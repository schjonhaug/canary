name: Gemini Code Review

on:
  pull_request:
    types: [opened, reopened]

concurrency:
  group: 'gemini-review-${{ github.event.pull_request.number }}'
  cancel-in-progress: true

jobs:
  gemini-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      issues: write
    outputs:
      gemini_response: ${{ steps.gemini.outputs.summary }}
      gemini_error: ${{ steps.gemini.outputs.error }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files and diff
        id: changed_files
        run: |
          BASE_SHA=$(git merge-base origin/${{ github.event.pull_request.base.ref }} HEAD)
          echo "base_sha=$BASE_SHA" >> $GITHUB_OUTPUT

          echo "files<<EOF" >> $GITHUB_OUTPUT
          git diff --name-only $BASE_SHA HEAD
          echo "EOF" >> $GITHUB_OUTPUT

          echo "diff<<EOF" >> $GITHUB_OUTPUT
          git diff $BASE_SHA HEAD | head -2000
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Run Gemini PR Review
        id: gemini
        uses: google-github-actions/run-gemini-cli@v0
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          prompt: |
            Review ONLY the changes in this pull request. Focus exclusively on the modified code in the diff.

            Changed files in this PR:
            ${{ steps.changed_files.outputs.files }}

            Here is the diff:
            ```diff
            ${{ steps.changed_files.outputs.diff }}
            ```

            Provide feedback on:
            - Code quality and best practices in the changed code
            - Potential bugs or issues introduced by these changes
            - Performance considerations for the new/modified code
            - Security concerns in the changed code
            - Whether the changes have adequate test coverage

            Be constructive and helpful. Only report findings relevant to this PR's changes.
            Format your response in markdown.

  post_feedback:
    runs-on: ubuntu-latest
    needs: gemini-review
    if: always() && needs.gemini-review.outputs.gemini_response != ''
    permissions:
      pull-requests: write
    steps:
      - name: Post Gemini feedback
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const header = '## 🤖 Gemini Code Review\n\n';
            const response = process.env.GEMINI_RESPONSE;

            if (!response || response.trim() === '') {
              console.log('No Gemini response to post');
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: header + response,
            });
        env:
          GEMINI_RESPONSE: ${{ needs.gemini-review.outputs.gemini_response }}
