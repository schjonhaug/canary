name: Gemini Code Review

on:
  pull_request:
    types: [opened, reopened, synchronize]

concurrency:
  group: 'gemini-review-${{ github.event.pull_request.number }}'
  cancel-in-progress: true

jobs:
  gemini-review:
    if: github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Get PR info
        id: pr_info
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          BASE_SHA=$(git merge-base "origin/$BASE_REF" HEAD)
          echo "base_sha=$BASE_SHA" >> $GITHUB_OUTPUT

          # Get changed files
          FILES=$(git diff --name-only $BASE_SHA HEAD | tr '\n' ', ' | sed 's/,$//')
          echo "files=$FILES" >> $GITHUB_OUTPUT

          # Get diff content and check if truncated
          FULL_DIFF=$(git diff $BASE_SHA HEAD)
          DIFF_SIZE=${#FULL_DIFF}
          MAX_SIZE=30000

          if [ $DIFF_SIZE -gt $MAX_SIZE ]; then
            echo "truncated=true" >> $GITHUB_OUTPUT
            {
              DELIMITER="GEMINI_DIFF_$(openssl rand -hex 16)"
              echo "diff<<$DELIMITER"
              echo "$FULL_DIFF" | head -c $MAX_SIZE
              echo ""
              echo "$DELIMITER"
            } >> $GITHUB_OUTPUT
          else
            echo "truncated=false" >> $GITHUB_OUTPUT
            {
              DELIMITER="GEMINI_DIFF_$(openssl rand -hex 16)"
              echo "diff<<$DELIMITER"
              echo "$FULL_DIFF"
              echo "$DELIMITER"
            } >> $GITHUB_OUTPUT
          fi

      - name: Run Gemini PR Review
        id: gemini
        uses: google-github-actions/run-gemini-cli@f77273f4c914e4bf38440cf36a0369cb64a37489
        env:
          GEMINI_CLI_TRUST_WORKSPACE: "true"
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          settings: >-
            {"security":{"disableYoloMode":true,"toolSandboxing":true,"environmentVariableRedaction":{"enabled":true}},"tools":{"sandboxNetworkAccess":false}}
          prompt: |
            Review the changes in this pull request.

            Changed files: ${{ steps.pr_info.outputs.files }}

            Please analyze the diff below and provide feedback on:
            - Code quality and best practices
            - Potential bugs or issues
            - Performance considerations
            - Security concerns
            - Test coverage

            Be constructive and helpful. Format your response in markdown.
            ${{ steps.pr_info.outputs.truncated == 'true' && '⚠️ Note: The diff below has been truncated due to size limits. Some changes may not be included in this review.' || '' }}

            ```diff
            ${{ steps.pr_info.outputs.diff }}
            ```

      - name: Post Gemini feedback
        if: always() && steps.gemini.outputs.summary != ''
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          github-token: ${{ github.token }}
          script: |
            const response = process.env.GEMINI_RESPONSE;

            if (!response || response.trim() === '') {
              console.log('No Gemini response to post');
              return;
            }

            // Check for existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });

            const existingComment = comments.find(c =>
              c.body?.includes('🤖 Gemini Code Review')
            );

            const body = '## 🤖 Gemini Code Review\n\n' + response;

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: body,
              });
              console.log('Updated existing Gemini comment');
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: body,
              });
              console.log('Created new Gemini comment');
            }
        env:
          GEMINI_RESPONSE: ${{ steps.gemini.outputs.summary }}

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          github-token: ${{ github.token }}
          script: |
            // Check for existing failure comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });

            const existingFailure = comments.find(c =>
              c.body?.includes('Gemini code review failed')
            );

            if (!existingFailure) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: '⚠️ **Gemini code review failed.** Check the [workflow logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.',
              });
            }
