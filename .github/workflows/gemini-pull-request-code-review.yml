name: Gemini Code Review

on:
  pull_request:
    types: [opened, reopened]

concurrency:
  group: 'gemini-review-${{ github.event.pull_request.number }}'
  cancel-in-progress: true

jobs:
  gemini-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR info
        id: pr_info
        run: |
          BASE_SHA=$(git merge-base origin/${{ github.event.pull_request.base.ref }} HEAD)
          echo "base_sha=$BASE_SHA" >> $GITHUB_OUTPUT

          # Get changed files
          FILES=$(git diff --name-only $BASE_SHA HEAD | tr '\n' ', ' | sed 's/,$//')
          echo "files=$FILES" >> $GITHUB_OUTPUT

          # Get diff content with delimiter for multiline output
          {
            echo "diff<<DIFF_EOF"
            git diff $BASE_SHA HEAD | head -c 30000
            echo ""
            echo "DIFF_EOF"
          } >> $GITHUB_OUTPUT

      - name: Run Gemini PR Review
        id: gemini
        uses: google-github-actions/run-gemini-cli@v0
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          prompt: |
            Review the changes in this pull request.

            Changed files: ${{ steps.pr_info.outputs.files }}

            Please analyze the diff below and provide feedback on:
            - Code quality and best practices
            - Potential bugs or issues
            - Performance considerations
            - Security concerns
            - Test coverage

            Be constructive and helpful. Format your response in markdown.

            ```diff
            ${{ steps.pr_info.outputs.diff }}
            ```

      - name: Post Gemini feedback
        if: always() && steps.gemini.outputs.summary != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const response = process.env.GEMINI_RESPONSE;

            if (!response || response.trim() === '') {
              console.log('No Gemini response to post');
              return;
            }

            // Check for existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });

            const existingComment = comments.find(c =>
              c.body?.includes('🤖 Gemini Code Review')
            );

            const body = '## 🤖 Gemini Code Review\n\n' + response;

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: body,
              });
              console.log('Updated existing Gemini comment');
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: body,
              });
              console.log('Created new Gemini comment');
            }
        env:
          GEMINI_RESPONSE: ${{ steps.gemini.outputs.summary }}
