# Keep both fields for compatibility across the pnpm versions used locally and in deploy scripts.
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  sharp: true
  unrs-resolver: true
onlyBuiltDependencies:
  - '@parcel/watcher'
  - '@swc/core'
  - sharp
  - unrs-resolver
overrides:
  '@babel/core': 7.29.6
  'brace-expansion@^1.0.0': 1.1.18
  'brace-expansion@^5.0.0': 5.0.9
  flatted: 3.4.2
  'js-yaml@^3.0.0': 3.15.1
  'js-yaml@^4.0.0': 4.3.1
  'nanoid@^3.0.0': 3.3.18
  'picomatch@^2.0.0': 2.3.2
  'picomatch@^4.0.0': 4.0.4
  postcss: 8.5.23
  sharp: 0.35.1
  ws: 8.21.0
