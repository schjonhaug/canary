# Advisories with no patched release in the version line our dependencies use.

[[IgnoredVulns]]
id = "RUSTSEC-2026-0459"
reason = "libsqlite3-sys 0.28 (bundled SQLite 3.45) comes in via bdk_chain 0.23, which requires rusqlite ^0.31 with the bundled feature; the fix exists only in libsqlite3-sys 0.39 (rusqlite 0.41), which no released bdk_chain/bdk_wallet uses yet. The bug needs a database and -wal file pair written by a less trusted party; Canary only opens SQLite files it created in its own private data directory. Drop this once bdk_wallet moves to rusqlite 0.41 or later."

# Maintenance warning, not a reported exploitable defect. Reassess within 60 days.
[[IgnoredVulns]]
id = "RUSTSEC-2026-0543"
effectiveUntil = 2027-01-16
reason = "chrono 0.4.45 is unmaintained; the advisory covers all versions and reports no concrete vulnerability or patched release. Canary uses chrono directly for timestamps and serialization. Temporarily accept this maintenance risk while planning migration to a maintained time library; remove this exception when chrono is replaced, and reassess by 2027-01-16. Only this advisory is excluded; future chrono security advisories remain gated."
