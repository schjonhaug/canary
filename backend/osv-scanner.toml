# Advisories with no patched release in the version line our dependencies use.

[[IgnoredVulns]]
id = "RUSTSEC-2026-0459"
reason = "libsqlite3-sys 0.28 (bundled SQLite 3.45) comes in via bdk_chain 0.23, which requires rusqlite ^0.31 with the bundled feature; the fix exists only in libsqlite3-sys 0.39 (rusqlite 0.41), which no released bdk_chain/bdk_wallet uses yet. The bug needs a database and -wal file pair written by a less trusted party; Canary only opens SQLite files it created in its own private data directory. Drop this once bdk_wallet moves to rusqlite 0.41 or later."
