[package]
name = "canary"
version = "1.7.1"
edition = "2021"
rust-version = "1.97"
description = "Self-hosted Bitcoin wallet monitoring with transaction and balance alerts"
license-file = "../LICENSE.md"
repository = "https://github.com/schjonhaug/canary"
publish = false

[lib]
name = "canary"
path = "src/lib.rs"

[dependencies]
bdk_wallet = { version = "~3.2", features = ["rusqlite"] }
bdk_electrum = "~0.24"
miniscript = "13.1"
axum = "0.8"
tower-http = { version = "0.7", features = ["cors"] }
tokio = { version = "1.46", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.0", features = ["derive"] }
dotenvy = "0.15"
phonenumber = "0.3"
icu = "2"
fixed_decimal = "0.7"
writeable = "0.6"
r2d2 = "0.8"
r2d2_sqlite = "0.24"
async-trait = "0.1"
reqwest = { version = "0.13", features = ["json", "form"] }
url = "2"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
base64 = "0.23"
jsonwebtoken = { version = "11", default-features = false, features = ["aws_lc_rs"] }
rand = "0.10"
sha2 = "0.11"
hmac = "0.13"
hex = "0.4"
argon2 = { version = "0.6", features = ["rand_core"] }
uuid = { version = "1", features = ["v4"] }
resend-rs = { version = "0.24", default-features = false, features = ["rustls-tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
regex = "1.10"
futures = "0.3"
xyzpub = "0.3"
rust-i18n = "4"
iso_currency = "0.7.0"
unic-langid = "0.9.6"
nostr-sdk = { version = "0.45.2", default-features = false, features = ["aws_lc_rs", "rustls-tls-native-roots"] }
nostr = { version = "0.45", features = ["nip04", "nip44", "nip59"] }
nostr-gossip-memory = "0.45"
totp-rs = { version = "6", default-features = false, features = ["std"] }

[dev-dependencies]
# Loopback relay used to verify the production client's NIP-42 authentication.
tokio-tungstenite = "0.30"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
tempfile = "3.3"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Documentation lints that would demand boilerplate sections on every fallible
# function; errors and panics are documented where they are not obvious.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
# Naming heuristics that flag domain pairs such as `sent`/`spent`.
similar_names = "allow"
# Request, preference and config structs mirror independent on/off settings.
struct_excessive_bools = "allow"
# Field names mirror database columns and API fields (`threshold_sats`, ...).
struct_field_names = "allow"
# Long functions are being split module by module; re-enable once that is done.
too_many_lines = "allow"

# System tests configuration
[[test]]
name = "two_stage_send_scenarios"
path = "system_tests/two_stage_send_scenarios.rs"

[[test]]
name = "high_index_scanning"
path = "system_tests/high_index_scanning.rs"

[[test]]
name = "advanced_transactions"
path = "system_tests/advanced_transactions.rs"

[[test]]
name = "mined_directly_scenarios"
path = "system_tests/mined_directly_scenarios.rs"

[[test]]
name = "transaction_timestamp_scenarios"
path = "system_tests/transaction_timestamp_scenarios.rs"

[[test]]
name = "balance_alert_scenarios"
path = "system_tests/balance_alert_scenarios.rs"

[[test]]
name = "utxo_consolidation_scenarios"
path = "system_tests/utxo_consolidation_scenarios.rs"

[[test]]
name = "self_send_scenarios"
path = "system_tests/self_send_scenarios.rs"

[[test]]
name = "wallet_recovery_scenarios"
path = "system_tests/wallet_recovery_scenarios.rs"

[[test]]
name = "batch_transaction_scenarios"
path = "system_tests/batch_transaction_scenarios.rs"

[[test]]
name = "mempool_chain_scenarios"
path = "system_tests/mempool_chain_scenarios.rs"

[[test]]
name = "address_watch_scenarios"
path = "system_tests/address_watch_scenarios.rs"

# phonenumber enables postcard's default `heapless-cas` feature, which pulls in the
# unmaintained atomic-polyfill crate (RUSTSEC-2023-0089). The vendored copy only
# changes that default; see vendor/postcard/CANARY-PATCH.md.
[patch.crates-io]
postcard = { path = "vendor/postcard" }
