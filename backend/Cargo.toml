[package]
name = "txray"
version = "0.1.0"
edition = "2024"

[dependencies]

bdk_wallet = { version = "2", features = ["rusqlite"] }
rusqlite = "0.31"
bdk_electrum = "0.23"
miniscript = "12.3"
axum = "0.8"
tokio = { version = "1.45", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
utoipa = { version = "5.4", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }
utoipa-axum = "0.2"
