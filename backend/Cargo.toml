[package]
name = "canary"
version = "0.14.1"
edition = "2021"

[lib]
name = "canary"
path = "src/lib.rs"

[dependencies]
bdk_wallet = { version = "2", features = ["rusqlite"] }
bdk_electrum = "0.23"
miniscript = "12.3"
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
tokio = { version = "1.46", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
utoipa = { version = "5.4", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.0", features = ["derive"] }
dotenvy = "0.15"
phonenumber = "0.3"
num-format = "0.4"
r2d2 = "0.8"
r2d2_sqlite = "0.24"
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json"] }
base64 = "0.22"
jsonwebtoken = "9.3"
rand = "0.8"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
argon2 = "0.5"
uuid = { version = "1", features = ["v4"] }
resend-rs = "0.16"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1.10"
futures = "0.3"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
tempfile = "3.3"

# System tests configuration
[[test]]
name = "two_stage_send_scenarios"
path = "system_tests/two_stage_send_scenarios.rs"

[[test]]
name = "high_index_scanning" 
path = "system_tests/high_index_scanning.rs"


[[test]]
name = "advanced_transactions"
path = "system_tests/advanced_transactions.rs"

[[test]]
name = "mined_directly_scenarios"
path = "system_tests/mined_directly_scenarios.rs"