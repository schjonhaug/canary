[package]
name = "canary"
version = "0.6.0"
edition = "2021"

[lib]
name = "canary"
path = "src/lib.rs"

[dependencies]
bdk_wallet = { version = "2", features = ["rusqlite"] }
bdk_electrum = "0.23"
miniscript = "12.3"
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
tokio = { version = "1.46", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
utoipa = { version = "5.4", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }
anyhow = "1.0"
secp256k1 = "0.31"
chrono = "0.4"
clap = { version = "4.0", features = ["derive"] }
dotenvy = "0.15"
phonenumber = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
num-format = "0.4"
r2d2 = "0.8"
r2d2_sqlite = "0.24"
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json"] }
base64 = "0.22"
jsonwebtoken = "9.3"
rand = "0.8"
sha2 = "0.10"
urlencoding = "2.1"
argon2 = "0.5"
uuid = { version = "1", features = ["v4"] }
resend-rs = "0.16"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-stripe = { version = "0.41", features = ["runtime-tokio-hyper", "billing", "checkout", "webhook-endpoints"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
mime = "0.3"
tempfile = "3.3"