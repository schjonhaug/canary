_version: 1

# Test notification (handlers/notifications.rs)
test_notification:
  title: "Test Notification"
  message: "This is a test notification from Canary. If you see this, your ntfy setup is working correctly!"

# Common strings used across multiple providers
common:
  greeting: "Hi %{to_name},"
  footer: "This notification was sent by Canary"
  wallet: "Wallet"

# Transaction notification messages (message_formatter.rs)
transaction:
  wallet_balance: "Wallet balance: %{balance_btc} BTC"
  receive:
    confirmed: "✅ Received: %{amount_btc} BTC to %{wallet_name}"
    pending: "💸 Receiving: %{amount_btc} BTC to %{wallet_name} (unconfirmed)"
    replaced: "🔄 Replaced: %{amount_btc} BTC to %{wallet_name} (replaced by %{short_txid})"
  send:
    confirmed_with_amount: "✅ Sent: %{amount_btc} BTC from %{wallet_name}"
    confirmed_no_amount: "✅ Sent from %{wallet_name}"
    pending: "📤 Sending: %{amount_btc} BTC from %{wallet_name}"
    cpfp: "⚡ CPFP fee bump: %{amount_btc} BTC from %{wallet_name} (child pays for parent)"
    replaced: "🔄 Replaced: %{amount_btc} BTC from %{wallet_name} (replaced by %{short_txid})"

# Balance alert messages (message_formatter.rs)
balance_alert:
  drain: "🚨 Wallet Drain Alert: %{wallet_name} balance is now 0 BTC"
  equals: "📊 Balance Alert: %{wallet_name} balance is now %{current_display}"
  above: "📊 Balance Alert: %{wallet_name} balance is now above %{threshold_display} (current: %{current_display})"
  below: "📊 Balance Alert: %{wallet_name} balance is now below %{threshold_display} (current: %{current_display})"

# Notification titles (used by email subjects and ntfy push titles)
titles:
  receive:
    pending: "Receiving Bitcoin"
    confirmed: "Bitcoin Received"
  send:
    pending: "Sending Bitcoin"
    confirmed: "Bitcoin Sent"
    cpfp: "CPFP Fee Bump"
  balance_alert: "Balance Alert"

# Email template content (email_provider.rs)
email:
  transaction:
    header: "Bitcoin Transaction"
  balance_alert:
    header: "Balance Alert"

# Auth email templates (email_service.rs)
auth_email:
  verify_email:
    subject: "Verify Your Email - Canary"
    header: "Welcome to Canary!"
    body: "Thank you for creating your Canary account! To get started, please verify your email address by clicking the button below."
    button: "Verify Email Address"
    link_fallback: "If the button doesn't work, you can copy and paste this link into your browser:"
    expiry: "This verification link will expire in 24 hours. If you didn't create an account, you can safely ignore this email."
  password_reset:
    subject: "Reset Your Password - Canary"
    header: "Reset Your Password"
    body: "We received a request to reset your password for your Canary account. Click the button below to create a new password."
    button: "Reset Password"
    link_fallback: "If the button doesn't work, you can copy and paste this link into your browser:"
    expiry: "This reset link will expire in 1 hour. If you didn't request a password reset, you can safely ignore this email."
  contact_otp:
    subject: "Verify Your Email - Canary"
    header: "Email Verification Required"
    body: "Please verify your email address to receive Bitcoin wallet notifications. Enter the verification code below:"
    expiry: "This verification code will expire in 10 minutes. If you didn't request this verification, you can safely ignore this email."
  trial_ending:
    subject: "Your Canary trial ends in 3 days"
    header: "Your Trial is Ending Soon"
    body: "Your 30-day Canary Team trial will end in 3 days on %{trial_ends_at}."
    continue_text: "To continue enjoying uninterrupted Bitcoin wallet monitoring with automatic notifications, please subscribe to one of our plans."
    what_happens_header: "What happens when your trial ends?"
    sync_stops: "Wallet syncing will stop"
    notifications_stop: "Notifications will stop"
    data_safe: "Your wallet data remains safe and accessible"
    button: "View Subscription Plans"
    choose_plan: "Choose the plan that's right for you:"
    personal_plan: "Personal: 1 wallet, 1 contact, 10-minute sync"
    team_plan: "Team: 5 wallets, 5 contacts per wallet, 2-minute sync"
  registration_attempt:
    subject: "Security Notice - Canary"
    header: "Registration Attempt Detected"
    body: "Someone tried to create a new Canary account using your email address. If this was you, you already have an account and can sign in or reset your password."
    button: "Reset Password"
    link_fallback: "If the button doesn't work, you can copy and paste this link into your browser:"
    security_note: "If you did not attempt to register, no action is needed. Your account remains secure."
  account_locked:
    subject: "Security Alert - Account Locked"
    header: "Account Security Alert"
    body: "Your Canary account has been temporarily locked due to multiple failed login attempts."
    unlock_text: "Your account will be automatically unlocked in %{minutes} minutes."
    security_warning: "If this wasn't you, we recommend resetting your password immediately to secure your account."
    button: "Reset Password"
