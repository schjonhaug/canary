_version: 1

# Test notification (handlers/notifications.rs)
test_notification:
  title: "Notification de test"
  message: "Ceci est une notification de test de Canary Wallet. Si vous voyez ce message, votre configuration ntfy fonctionne correctement !"

webhook_test_notification:
  title: "Test du webhook Canary"
  message: "Ceci est un webhook de test de Canary Wallet. Votre endpoint est accessible."

# Common strings used across multiple providers
common:
  greeting: "Bonjour %{to_name},"
  footer: "Cette notification a été envoyée par Canary Wallet"
  wallet: "Portefeuille"

privacy:
  activity_detected: "Activité du portefeuille détectée"
  activity_confirmed: "Activité du portefeuille confirmée"

# Transaction notification messages (message_formatter.rs)
transaction:
  wallet_balance: "Solde du portefeuille : %{balance_btc} BTC"
  receive:
    confirmed: "✅ Reçu: %{amount_btc} BTC sur %{wallet_name}"
    pending: "💸 Réception: %{amount_btc} BTC sur %{wallet_name} (non confirmé)"
    replaced: "🔄 Remplacé: %{amount_btc} BTC vers %{wallet_name} (remplacé par %{short_txid})"
  send:
    confirmed_with_amount: "✅ Envoyé: %{amount_btc} BTC de %{wallet_name}"
    confirmed_no_amount: "✅ Envoyé de %{wallet_name}"
    pending: "📤 Envoi: %{amount_btc} BTC de %{wallet_name}"
    cpfp: "⚡ Augmentation de frais CPFP: %{amount_btc} BTC de %{wallet_name} (child pays for parent)"
    replaced: "🔄 Remplacé: %{amount_btc} BTC de %{wallet_name} (remplacé par %{short_txid})"

# Balance alert messages (message_formatter.rs)
balance_alert:
  drain: "🚨 Portefeuille vide: Le solde de %{wallet_name} est maintenant 0 BTC"
  equals: "📊 Alerte de Solde: Le solde de %{wallet_name} est maintenant %{current_display}"
  above: "📊 Alerte de Solde: Le solde de %{wallet_name} est maintenant au-dessus de %{threshold_display} (actuel: %{current_display})"
  below: "📊 Alerte de Solde: Le solde de %{wallet_name} est maintenant en dessous de %{threshold_display} (actuel: %{current_display})"

# Notification titles (used by email subjects and ntfy push titles)
titles:
  rbf: "Remplacement RBF"
  receive:
    pending: "Réception de Bitcoin"
    confirmed: "Bitcoin Reçu"
  send:
    pending: "Envoi de Bitcoin"
    confirmed: "Bitcoin Envoyé"
    cpfp: "Augmentation de frais CPFP"
  balance_alert: "Alerte de Solde"

# Email template content (email_provider.rs)
email:
  transaction:
    header: "Transaction Bitcoin"
  balance_alert:
    header: "Alerte de Solde"

# Auth email templates (email_service.rs)
auth_email:
  verify_email:
    subject: "Vérifiez votre adresse e-mail - Canary Wallet"
    header: "Bienvenue sur Canary Wallet !"
    body: "Merci d'avoir créé votre compte Canary Wallet ! Pour commencer, veuillez vérifier votre adresse e-mail en cliquant sur le bouton ci-dessous."
    button: "Vérifier l'adresse e-mail"
    link_fallback: "Si le bouton ne fonctionne pas, vous pouvez copier et coller ce lien dans votre navigateur :"
    expiry: "Ce lien de vérification expirera dans 24 heures. Si vous n'avez pas créé de compte, vous pouvez ignorer cet e-mail en toute sécurité."
  password_reset:
    subject: "Réinitialisez votre mot de passe - Canary Wallet"
    header: "Réinitialisez votre mot de passe"
    body: "Nous avons reçu une demande de réinitialisation de votre mot de passe pour votre compte Canary Wallet. Cliquez sur le bouton ci-dessous pour créer un nouveau mot de passe."
    button: "Réinitialiser le mot de passe"
    link_fallback: "Si le bouton ne fonctionne pas, vous pouvez copier et coller ce lien dans votre navigateur :"
    expiry: "Ce lien de réinitialisation expirera dans 1 heure. Si vous n'avez pas demandé de réinitialisation de mot de passe, vous pouvez ignorer cet e-mail en toute sécurité."
  contact_otp:
    subject: "Vérifiez votre adresse e-mail - Canary Wallet"
    header: "Vérification de l'adresse e-mail requise"
    body: "Veuillez vérifier votre adresse e-mail pour recevoir les notifications du portefeuille Bitcoin. Saisissez le code de vérification ci-dessous :"
    expiry: "Ce code de vérification expirera dans 10 minutes. Si vous n'avez pas demandé cette vérification, vous pouvez ignorer cet e-mail en toute sécurité."
  trial_ending:
    subject: "Votre période d'essai Canary Wallet se termine dans 3 jours"
    header: "Votre période d'essai se termine bientôt"
    body: "Votre essai de 30 jours de Canary Wallet Team se terminera dans 3 jours, le %{trial_ends_at}."
    continue_text: "Pour continuer à profiter d'une surveillance ininterrompue de votre portefeuille Bitcoin avec des notifications automatiques, veuillez vous abonner à l'un de nos forfaits."
    what_happens_header: "Que se passe-t-il à la fin de votre période d'essai ?"
    sync_stops: "La synchronisation du portefeuille s'arrêtera"
    notifications_stop: "Les notifications s'arrêteront"
    data_safe: "Les données de votre portefeuille restent sécurisées et accessibles"
    button: "Voir les forfaits d'abonnement"
    choose_plan: "Choisissez le forfait qui vous convient :"
    personal_plan: "Personnel : 1 portefeuille, 1 contact, synchronisation toutes les 10 minutes"
    team_plan: "Équipe : 5 portefeuilles, 5 contacts par portefeuille, synchronisation toutes les 2 minutes"
  registration_attempt:
    subject: "Avis de sécurité - Canary Wallet"
    header: "Tentative d'inscription détectée"
    body: "Quelqu'un a tenté de créer un nouveau compte Canary Wallet en utilisant votre adresse e-mail. Si c'était vous, vous possédez déjà un compte et pouvez vous connecter ou réinitialiser votre mot de passe."
    button: "Réinitialiser le mot de passe"
    link_fallback: "Si le bouton ne fonctionne pas, vous pouvez copier et coller ce lien dans votre navigateur :"
    security_note: "Si vous n'avez pas tenté de vous inscrire, aucune action n'est requise. Votre compte reste sécurisé."
  account_locked:
    subject: "Alerte de sécurité - Compte verrouillé"
    header: "Alerte de sécurité du compte"
    body: "Votre compte Canary Wallet a été temporairement verrouillé en raison de plusieurs tentatives de connexion infructueuses."
    unlock_text: "Votre compte sera automatiquement déverrouillé dans %{minutes} minutes."
    security_warning: "Si ce n'était pas vous, nous vous recommandons de réinitialiser votre mot de passe immédiatement pour sécuriser votre compte."
    button: "Réinitialiser le mot de passe"
