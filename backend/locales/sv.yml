_version: 1

# Test notification (handlers/notifications.rs)
test_notification:
  title: "Testavisering"
  message: "Detta är en testavisering från Canary Wallet. Om du ser detta fungerar din ntfy-konfiguration korrekt!"

webhook_test_notification:
  title: "Canary webhook-test"
  message: "Detta är en test-webhook från Canary Wallet. Din endpoint går att nå."

# Common strings used across multiple providers
common:
  greeting: "Hej %{to_name},"
  footer: "Denna avisering skickades av Canary Wallet"
  wallet: "Plånbok"

privacy:
  activity_detected: "Plånboksaktivitet upptäckt"
  activity_confirmed: "Plånboksaktivitet bekräftad"

# Transaction notification messages (message_formatter.rs)
transaction:
  wallet_balance: "Plånbokssaldo: %{balance_btc} BTC"
  receive:
    confirmed: "✅ Mottaget: %{amount_btc} BTC till %{wallet_name}"
    pending: "💸 Tar emot: %{amount_btc} BTC till %{wallet_name} (obekräftad)"
    replaced: "🔄 Ersatt: %{amount_btc} BTC till %{wallet_name} (ersatt av %{short_txid})"
  send:
    confirmed_with_amount: "✅ Skickat: %{amount_btc} BTC från %{wallet_name}"
    confirmed_no_amount: "✅ Skickat från %{wallet_name}"
    pending: "📤 Skickar: %{amount_btc} BTC från %{wallet_name}"
    cpfp: "⚡ CPFP-avgiftshöjning: %{amount_btc} BTC från %{wallet_name} (child pays for parent)"
    replaced: "🔄 Ersatt: %{amount_btc} BTC från %{wallet_name} (ersatt av %{short_txid})"

# Balance alert messages (message_formatter.rs)
balance_alert:
  drain: "🚨 Varning för tömd plånbok: %{wallet_name} saldo är nu 0 BTC"
  equals: "📊 Saldovarning: %{wallet_name} saldo är nu %{current_display}"
  above: "📊 Saldovarning: %{wallet_name} saldo är nu över %{threshold_display} (nuvarande: %{current_display})"
  below: "📊 Saldovarning: %{wallet_name} saldo är nu under %{threshold_display} (nuvarande: %{current_display})"

# Notification titles (used by email subjects and ntfy push titles)
titles:
  rbf: "RBF-ersättning"
  receive:
    pending: "Tar emot Bitcoin"
    confirmed: "Bitcoin mottaget"
  send:
    pending: "Skickar Bitcoin"
    confirmed: "Bitcoin skickat"
    cpfp: "CPFP-avgiftshöjning"
  balance_alert: "Saldovarning"

# Email template content (email_provider.rs)
email:
  transaction:
    header: "Bitcoin-transaktion"
  balance_alert:
    header: "Saldovarning"

# Auth email templates (email_service.rs)
auth_email:
  verify_email:
    subject: "Verifiera din e-post - Canary Wallet"
    header: "Välkommen till Canary Wallet!"
    body: "Tack för att du skapade ditt Canary Wallet-konto! För att komma igång, vänligen verifiera din e-postadress genom att klicka på knappen nedan."
    button: "Verifiera e-postadress"
    link_fallback: "Om knappen inte fungerar kan du kopiera och klistra in denna länk i din webbläsare:"
    expiry: "Denna verifieringslänk upphör att gälla om 24 timmar. Om du inte har skapat ett konto kan du bortse från detta e-postmeddelande."
  password_reset:
    subject: "Återställ ditt lösenord - Canary Wallet"
    header: "Återställ ditt lösenord"
    body: "Vi har tagit emot en begäran om att återställa lösenordet för ditt Canary Wallet-konto. Klicka på knappen nedan för att skapa ett nytt lösenord."
    button: "Återställ lösenord"
    link_fallback: "Om knappen inte fungerar kan du kopiera och klistra in denna länk i din webbläsare:"
    expiry: "Denna återställningslänk upphör att gälla om 1 timme. Om du inte har begärt en lösenordsåterställning kan du bortse från detta e-postmeddelande."
  contact_otp:
    subject: "Verifiera din e-post - Canary Wallet"
    header: "E-postverifiering krävs"
    body: "Vänligen verifiera din e-postadress för att ta emot aviseringar om Bitcoin-plånböcker. Ange verifieringskoden nedan:"
    expiry: "Denna verifieringskod upphör att gälla om 10 minuter. Om du inte har begärt denna verifiering kan du bortse från detta e-postmeddelande."
  trial_ending:
    subject: "Din testperiod för Canary Wallet går ut om 3 dagar"
    header: "Din testperiod tar snart slut"
    body: "Din 30-dagars testperiod för Canary Wallet Team går ut om 3 dagar, den %{trial_ends_at}."
    continue_text: "För att fortsätta använda oavbruten bevakning av Bitcoin-plånböcker med automatiska aviseringar, vänligen prenumerera på en av våra planer."
    what_happens_header: "Vad händer när din testperiod går ut?"
    sync_stops: "Plånbokssynkroniseringen stoppas"
    notifications_stop: "Aviseringarna stoppas"
    data_safe: "Din plånboksdata förblir säker och tillgänglig"
    button: "Visa prenumerationsplaner"
    choose_plan: "Välj den plan som passar dig bäst:"
    personal_plan: "Personal: 1 plånbok, 1 kontakt, 10-minuters synkronisering"
    team_plan: "Team: 5 plånböcker, 5 kontakter per plånbok, 2-minuters synkronisering"
  registration_attempt:
    subject: "Säkerhetsmeddelande - Canary Wallet"
    header: "Registreringsförsök upptäckt"
    body: "Någon försökte skapa ett nytt Canary Wallet-konto med din e-postadress. Om detta var du har du redan ett konto och kan logga in eller återställa ditt lösenord."
    button: "Återställ lösenord"
    link_fallback: "Om knappen inte fungerar kan du kopiera och klistra in denna länk i din webbläsare:"
    security_note: "Om du inte försökte registrera dig krävs ingen åtgärd. Ditt konto förblir säkert."
  account_locked:
    subject: "Säkerhetsvarning - Kontot låst"
    header: "Säkerhetsvarning för konto"
    body: "Ditt Canary Wallet-konto har låsts tillfälligt på grund av flera misslyckade inloggningsförsök."
    unlock_text: "Ditt konto kommer att låsas upp automatiskt om %{minutes} minuter."
    security_warning: "Om detta inte var du rekommenderar vi att du återställer ditt lösenord omedelbart för att säkra ditt konto."
    button: "Återställ lösenord"
