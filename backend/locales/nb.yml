_version: 1

# Test notification (handlers/notifications.rs)
test_notification:
  title: "Testvarsel"
  message: "Dette er et testvarsel fra Canary. Hvis du ser dette, fungerer ntfy-oppsettet ditt som det skal!"

# Common strings used across multiple providers
common:
  greeting: "Hei %{to_name},"
  footer: "Dette varselet ble sendt av Canary"
  wallet: "Lommebok"

# Transaction notification messages (message_formatter.rs)
transaction:
  receive:
    confirmed: "✅ Mottatt: %{amount_btc} BTC til %{wallet_name}"
    pending: "💸 Mottar: %{amount_btc} BTC til %{wallet_name} (ubekreftet)"
    replaced: "🔄 Erstattet: %{amount_btc} BTC til %{wallet_name} (erstattet av %{short_txid})"
  send:
    confirmed_with_amount: "✅ Sendt: %{amount_btc} BTC fra %{wallet_name}"
    confirmed_no_amount: "✅ Sendt fra %{wallet_name}"
    pending: "📤 Sender: %{amount_btc} BTC fra %{wallet_name}"
    replaced: "🔄 Erstattet: %{amount_btc} BTC fra %{wallet_name} (erstattet av %{short_txid})"

# Balance alert messages (message_formatter.rs)
balance_alert:
  drain: "🚨 Lommebok tømt: %{wallet_name} saldo er nå 0 BTC"
  equals: "📊 Saldovarsel: %{wallet_name} saldo er nå %{current_display}"
  above: "📊 Saldovarsel: %{wallet_name} saldo er nå over %{threshold_display} (nåværende: %{current_display})"
  below: "📊 Saldovarsel: %{wallet_name} saldo er nå under %{threshold_display} (nåværende: %{current_display})"

# Notification titles (used by email subjects and ntfy push titles)
titles:
  receive:
    pending: "Mottar Bitcoin"
    confirmed: "Bitcoin mottatt"
  send:
    pending: "Sender Bitcoin"
    confirmed: "Bitcoin sendt"
  balance_alert: "Saldovarsel"

# Email template content (email_provider.rs)
email:
  transaction:
    header: "Bitcoin-transaksjon"
  balance_alert:
    header: "Saldovarsel"

# Auth email templates (email_service.rs)
auth_email:
  verify_email:
    subject: "Bekreft e-postadressen din - Canary"
    header: "Velkommen til Canary!"
    body: "Takk for at du opprettet din Canary-konto! For å komme i gang må du bekrefte e-postadressen din ved å klikke på knappen nedenfor."
    button: "Bekreft e-postadresse"
    link_fallback: "Hvis knappen ikke fungerer, kan du kopiere og lime inn denne lenken i nettleseren din:"
    expiry: "Denne bekreftelseslenken utløper om 24 timer. Hvis du ikke har opprettet en konto, kan du trygt ignorere denne e-posten."
  password_reset:
    subject: "Tilbakestill passordet ditt - Canary"
    header: "Tilbakestill passordet ditt"
    body: "Vi har mottatt en forespørsel om å tilbakestille passordet for din Canary-konto. Klikk på knappen nedenfor for å lage et nytt passord."
    button: "Tilbakestill passord"
    link_fallback: "Hvis knappen ikke fungerer, kan du kopiere og lime inn denne lenken i nettleseren din:"
    expiry: "Denne lenken for tilbakestilling utløper om 1 time. Hvis du ikke har bedt om å tilbakestille passordet, kan du trygt ignorere denne e-posten."
  contact_otp:
    subject: "Bekreft e-postadressen din - Canary"
    header: "E-postbekreftelse kreves"
    body: "Vennligst bekreft e-postadressen din for å motta varsler for Bitcoin-lommebøker. Skriv inn bekreftelseskoden nedenfor:"
    expiry: "Denne bekreftelseskoden utløper om 10 minutter. Hvis du ikke har bedt om denne bekreftelsen, kan du trygt ignorere denne e-posten."
  trial_ending:
    subject: "Ditt Canary-prøveabonnement utløper om 3 dager"
    header: "Prøveperioden din avsluttes snart"
    body: "Din 30-dagers Canary Team-prøveperiode utløper om 3 dager den %{trial_ends_at}."
    continue_text: "For å fortsette å nyte uavbrutt overvåking av Bitcoin-lommebøker med automatiske varsler, vennligst abonner på en av våre planer."
    what_happens_header: "Hva skjer når prøveperioden utløper?"
    sync_stops: "Synkronisering av lommebøker vil stoppe"
    notifications_stop: "Varsler vil stoppe"
    data_safe: "Dine lommebokdata forblir trygge og tilgjengelige"
    button: "Se abonnementsplaner"
    choose_plan: "Velg planen som passer for deg:"
    personal_plan: "Personlig: 1 lommebok, 1 kontakt, 10-minutters synkronisering"
    team_plan: "Team: 5 lommebøker, 5 kontakter per lommebok, 2-minutters synkronisering"
  account_locked:
    subject: "Sikkerhetsvarsel - Konto låst"
    header: "Sikkerhetsvarsel for konto"
    body: "Din Canary-konto har blitt midlertidig låst på grunn av flere mislykkede påloggingsforsøk."
    unlock_text: "Kontoen din vil bli automatisk låst opp om %{minutes} minutter."
    security_warning: "Hvis dette ikke var deg, anbefaler vi at du tilbakestiller passordet ditt umiddelbart for å sikre kontoen din."
    button: "Tilbakestill passord"
