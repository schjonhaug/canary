_version: 1

# Test notification (handlers/notifications.rs)
test_notification:
  title: "テスト通知"
  message: "これはCanary Walletからのテスト通知です。これが表示されていれば、ntfyの設定は正しく動作しています！"

webhook_test_notification:
  title: "Canary Webhookテスト"
  message: "これはCanary WalletからのテストWebhookです。エンドポイントに到達できました。"

# Common strings used across multiple providers
common:
  greeting: "%{to_name} 様,"
  footer: "この通知はCanary Walletから送信されました"
  wallet: "ウォレット"

privacy:
  activity_detected: "ウォレットのアクティビティを検出しました"
  activity_confirmed: "ウォレットのアクティビティが承認されました"

# Transaction notification messages (message_formatter.rs)
transaction:
  wallet_balance: "ウォレット残高: %{balance_btc} BTC"
  receive:
    confirmed: "✅ 受取完了: %{amount_btc} BTC を %{wallet_name} へ"
    pending: "💸 受取中: %{amount_btc} BTC を %{wallet_name} へ (未確認)"
    replaced: "🔄 置換: %{amount_btc} BTC を %{wallet_name} へ (%{short_txid} に置換)"
  send:
    confirmed_with_amount: "✅ 送信完了: %{amount_btc} BTC を %{wallet_name} から"
    confirmed_no_amount: "✅ %{wallet_name} から送信完了"
    pending: "📤 送信中: %{amount_btc} BTC を %{wallet_name} から"
    cpfp: "⚡ CPFP手数料引き上げ: %{amount_btc} BTC を %{wallet_name} から (child pays for parent)"
    replaced: "🔄 置換: %{amount_btc} BTC を %{wallet_name} から (%{short_txid} に置換)"

# Balance alert messages (message_formatter.rs)
balance_alert:
  drain: "🚨 ウォレット残高ゼロ: %{wallet_name} の残高は 0 BTC になりました"
  equals: "📊 残高アラート: %{wallet_name} の残高は %{current_display} になりました"
  above: "📊 残高アラート: %{wallet_name} の残高が %{threshold_display} を超えました (現在: %{current_display})"
  below: "📊 残高アラート: %{wallet_name} の残高が %{threshold_display} を下回りました (現在: %{current_display})"

# Notification titles (used by email subjects and ntfy push titles)
titles:
  rbf: "RBF置換"
  receive:
    pending: "ビットコイン受取中"
    confirmed: "ビットコイン受取完了"
  send:
    pending: "ビットコイン送信中"
    confirmed: "ビットコイン送信完了"
    cpfp: "CPFP手数料引き上げ"
  balance_alert: "残高アラート"

# Email template content (email_provider.rs)
email:
  transaction:
    header: "ビットコイン取引"
  balance_alert:
    header: "残高アラート"

# Auth email templates (email_service.rs)
auth_email:
  verify_email:
    subject: "メールアドレスの確認 - Canary Wallet"
    header: "Canary Walletへようこそ！"
    body: "Canary Walletアカウントを作成していただき、ありがとうございます。以下のボタンをクリックしてメールアドレスを確認し、利用を開始してください。"
    button: "メールアドレスを確認"
    link_fallback: "ボタンが機能しない場合は、以下のリンクをブラウザにコピー＆ペーストしてください："
    expiry: "この確認リンクの有効期限は24時間です。アカウントを作成した覚えがない場合は、このメールを無視していただいて問題ありません。"
  password_reset:
    subject: "パスワードのリセット - Canary Wallet"
    header: "パスワードのリセット"
    body: "Canary Walletアカウントのパスワードリセットのリクエストを受け付けました。以下のボタンをクリックして新しいパスワードを作成してください。"
    button: "パスワードをリセット"
    link_fallback: "ボタンが機能しない場合は、以下のリンクをブラウザにコピー＆ペーストしてください："
    expiry: "このリセットリンクの有効期限は1時間です。パスワードのリセットをリクエストしていない場合は、このメールを無視していただいて問題ありません。"
  contact_otp:
    subject: "メールアドレスの確認 - Canary Wallet"
    header: "メールアドレスの確認が必要です"
    body: "ビットコインウォレットの通知を受け取るには、メールアドレスを確認してください。以下の確認コードを入力してください："
    expiry: "この確認コードの有効期限は10分です。この確認をリクエストしていない場合は、このメールを無視していただいて問題ありません。"
  trial_ending:
    subject: "Canary Walletのトライアル期間終了まであと3日です"
    header: "トライアル期間がもうすぐ終了します"
    body: "30日間のCanary Walletチームトライアルは、3日後の %{trial_ends_at} に終了します。"
    continue_text: "引き続き、自動通知によるビットコインウォレットのモニタリングを中断なく利用するには、いずれかのプランを購読してください。"
    what_happens_header: "トライアルが終了するとどうなりますか？"
    sync_stops: "ウォレットの同期が停止します"
    notifications_stop: "通知が停止します"
    data_safe: "ウォレットデータは安全に保管され、引き続きアクセス可能です"
    button: "サブスクリプションプランを見る"
    choose_plan: "あなたにぴったりのプランをお選びください："
    personal_plan: "パーソナル：1ウォレット、1連絡先、10分間隔の同期"
    team_plan: "チーム：5ウォレット、1ウォレットあたり5連絡先、2分間隔の同期"
  registration_attempt:
    subject: "セキュリティ通知 - Canary Wallet"
    header: "登録の試行が検出されました"
    body: "あなたのメールアドレスを使用して、Canary Walletの新しいアカウントを作成しようとした形跡があります。もし心当たりがある場合は、すでにアカウントをお持ちですので、ログインするかパスワードをリセットしてください。"
    button: "パスワードをリセット"
    link_fallback: "ボタンが正しく動作しない場合は、以下のリンクをコピーしてブラウザに貼り付けてください："
    security_note: "登録を試みていない場合は、何もする必要はありません。アカウントのセキュリティは維持されています。"
  account_locked:
    subject: "セキュリティアラート - アカウントがロックされました"
    header: "アカウントのセキュリティアラート"
    body: "ログインの失敗が複数回繰り返されたため、Canary Walletアカウントが一時的にロックされました。"
    unlock_text: "アカウントは %{minutes} 分後に自動的にロック解除されます。"
    security_warning: "心当たりがない場合は、アカウントの安全を確保するために、すぐにパスワードをリセットすることをお勧めします。"
    button: "パスワードをリセット"
