_version: 1

# Transaction notification messages (message_formatter.rs)
transaction:
  receive:
    confirmed: "✅ Recebido: %{amount_btc} BTC em %{wallet_name}"
    pending: "💸 Recebendo: %{amount_btc} BTC em %{wallet_name} (nao confirmado)"
    replaced: "🔄 Substituido: %{amount_btc} BTC para %{wallet_name} (substituido por %{short_txid})"
  send:
    confirmed_with_amount: "✅ Enviado: %{amount_btc} BTC de %{wallet_name}"
    confirmed_no_amount: "✅ Enviado de %{wallet_name}"
    pending: "📤 Enviando: %{amount_btc} BTC de %{wallet_name}"
    replaced: "🔄 Substituido: %{amount_btc} BTC de %{wallet_name} (substituido por %{short_txid})"

# Balance alert messages (message_formatter.rs)
balance_alert:
  drain: "🚨 Alerta de Esvaziamento: O saldo de %{wallet_name} agora e 0 BTC"
  equals: "📊 Alerta de Saldo: O saldo de %{wallet_name} agora e %{current_display}"
  above: "📊 Alerta de Saldo: O saldo de %{wallet_name} agora esta acima de %{threshold_display} (atual: %{current_display})"
  below: "📊 Alerta de Saldo: O saldo de %{wallet_name} agora esta abaixo de %{threshold_display} (atual: %{current_display})"

# Email subject lines (message_formatter.rs)
subject:
  receive:
    pending: "Recebendo Bitcoin"
    confirmed: "Bitcoin Recebido"
  send:
    pending: "Enviando Bitcoin"
    confirmed: "Bitcoin Enviado"
  balance_alert: "Alerta de Saldo"

# Email template content (email_provider.rs)
email:
  transaction:
    header: "Transacao de Bitcoin"
    greeting: "Ola %{to_name},"
    footer: "Esta notificacao foi enviada por Canary"
  balance_alert:
    header: "Alerta de Saldo"
    wallet_label: "Carteira"
    greeting: "Ola %{to_name},"
    footer: "Esta notificacao foi enviada por Canary"

# Push notification titles (ntfy_provider.rs)
ntfy:
  receive:
    pending: "Recebendo Bitcoin - %{wallet_name}"
    confirmed: "Bitcoin Recebido - %{wallet_name}"
  send:
    pending: "Enviando Bitcoin - %{wallet_name}"
    confirmed: "Bitcoin Enviado - %{wallet_name}"
  balance_alert: "Alerta de Saldo - %{wallet_name}"
