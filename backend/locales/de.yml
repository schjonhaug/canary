_version: 1

# Common strings used across multiple providers
common:
  greeting: "Hallo %{to_name},"
  footer: "Diese Benachrichtigung wurde von Canary gesendet"
  wallet: "Wallet"

# Transaction notification messages (message_formatter.rs)
transaction:
  receive:
    confirmed: "✅ Erhalten: %{amount_btc} BTC an %{wallet_name}"
    pending: "💸 Empfange: %{amount_btc} BTC an %{wallet_name} (unbestätigt)"
    replaced: "🔄 Ersetzt: %{amount_btc} BTC an %{wallet_name} (ersetzt durch %{short_txid})"
  send:
    confirmed_with_amount: "✅ Gesendet: %{amount_btc} BTC von %{wallet_name}"
    confirmed_no_amount: "✅ Gesendet von %{wallet_name}"
    pending: "📤 Sende: %{amount_btc} BTC von %{wallet_name}"
    replaced: "🔄 Ersetzt: %{amount_btc} BTC von %{wallet_name} (ersetzt durch %{short_txid})"

# Balance alert messages (message_formatter.rs)
balance_alert:
  drain: "🚨 Wallet leer: %{wallet_name} Guthaben ist jetzt 0 BTC"
  equals: "📊 Saldowarnung: %{wallet_name} Guthaben ist jetzt %{current_display}"
  above: "📊 Saldowarnung: %{wallet_name} Guthaben ist jetzt über %{threshold_display} (aktuell: %{current_display})"
  below: "📊 Saldowarnung: %{wallet_name} Guthaben ist jetzt unter %{threshold_display} (aktuell: %{current_display})"

# Notification titles (used by email subjects and ntfy push titles)
titles:
  receive:
    pending: "Bitcoin empfangen"
    confirmed: "Bitcoin erhalten"
  send:
    pending: "Bitcoin senden"
    confirmed: "Bitcoin gesendet"
  balance_alert: "Saldowarnung"

# Email template content (email_provider.rs)
email:
  transaction:
    header: "Bitcoin-Transaktion"
  balance_alert:
    header: "Saldowarnung"
