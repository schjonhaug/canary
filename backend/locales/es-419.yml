_version: 1

# Common strings used across multiple providers
common:
  greeting: "Hola %{to_name},"
  footer: "Esta notificacion fue enviada por Canary"
  wallet: "Billetera"

# Transaction notification messages (message_formatter.rs)
transaction:
  receive:
    confirmed: "✅ Recibido: %{amount_btc} BTC en %{wallet_name}"
    pending: "💸 Recibiendo: %{amount_btc} BTC en %{wallet_name} (sin confirmar)"
    replaced: "🔄 Reemplazado: %{amount_btc} BTC a %{wallet_name} (reemplazado por %{short_txid})"
  send:
    confirmed_with_amount: "✅ Enviado: %{amount_btc} BTC desde %{wallet_name}"
    confirmed_no_amount: "✅ Enviado desde %{wallet_name}"
    pending: "📤 Enviando: %{amount_btc} BTC desde %{wallet_name}"
    replaced: "🔄 Reemplazado: %{amount_btc} BTC desde %{wallet_name} (reemplazado por %{short_txid})"

# Balance alert messages (message_formatter.rs)
balance_alert:
  drain: "🚨 Alerta de Vaciado: El saldo de %{wallet_name} es ahora 0 BTC"
  equals: "📊 Alerta de Saldo: El saldo de %{wallet_name} es ahora %{current_display}"
  above: "📊 Alerta de Saldo: El saldo de %{wallet_name} esta ahora por encima de %{threshold_display} (actual: %{current_display})"
  below: "📊 Alerta de Saldo: El saldo de %{wallet_name} esta ahora por debajo de %{threshold_display} (actual: %{current_display})"

# Notification titles (used by email subjects and ntfy push titles)
titles:
  receive:
    pending: "Recibiendo Bitcoin"
    confirmed: "Bitcoin Recibido"
  send:
    pending: "Enviando Bitcoin"
    confirmed: "Bitcoin Enviado"
  balance_alert: "Alerta de Saldo"

# Email template content (email_provider.rs)
email:
  transaction:
    header: "Transaccion de Bitcoin"
  balance_alert:
    header: "Alerta de Saldo"

# Auth email templates (email_service.rs)
auth_email:
  verify_email:
    subject: "Verifica tu correo electrónico - Canary"
    header: "¡Te damos la bienvenida a Canary!"
    body: "¡Gracias por crear tu cuenta de Canary! Para comenzar, verifica tu dirección de correo electrónico haciendo clic en el botón de abajo."
    button: "Verificar dirección de correo electrónico"
    link_fallback: "Si el botón no funciona, puedes copiar y pegar este enlace en tu navegador:"
    expiry: "Este enlace de verificación caducará en 24 horas. Si no creaste una cuenta, puedes ignorar este correo electrónico de forma segura."
  password_reset:
    subject: "Restablece tu contraseña - Canary"
    header: "Restablece tu contraseña"
    body: "Recibimos una solicitud para restablecer la contraseña de tu cuenta de Canary. Haz clic en el botón de abajo para crear una nueva contraseña."
    button: "Restablecer contraseña"
    link_fallback: "Si el botón no funciona, puedes copiar y pegar este enlace en tu navegador:"
    expiry: "Este enlace de restablecimiento caducará en 1 hora. Si no solicitaste un restablecimiento de contraseña, puedes ignorar este correo electrónico de forma segura."
  contact_otp:
    subject: "Verifica tu correo electrónico - Canary"
    header: "Verificación de correo electrónico requerida"
    body: "Verifica tu dirección de correo electrónico para recibir notificaciones de tu billetera Bitcoin. Ingresa el código de verificación a continuación:"
    expiry: "Este código de verificación caducará en 10 minutos. Si no solicitaste esta verificación, puedes ignorar este correo electrónico de forma segura."
  trial_ending:
    subject: "Tu prueba de Canary termina en 3 días"
    header: "Tu prueba terminará pronto"
    body: "Tu prueba de 30 días de Canary Team terminará en 3 días, el %{trial_ends_at}."
    continue_text: "Para seguir disfrutando del monitoreo ininterrumpido de tu billetera Bitcoin con notificaciones automáticas, suscríbete a uno de nuestros planes."
    what_happens_header: "¿Qué pasa cuando termina tu prueba?"
    sync_stops: "La sincronización de la billetera se detendrá"
    notifications_stop: "Las notificaciones se detendrán"
    data_safe: "Los datos de tu billetera permanecen seguros y accesibles"
    button: "Ver planes de suscripción"
    choose_plan: "Elige el plan adecuado para ti:"
    personal_plan: "Personal: 1 billetera, 1 contacto, sincronización de 10 minutos"
    team_plan: "Team: 5 billeteras, 5 contactos por billetera, sincronización de 2 minutos"
  account_locked:
    subject: "Alerta de seguridad - Cuenta bloqueada"
    header: "Alerta de seguridad de la cuenta"
    body: "Tu cuenta de Canary ha sido bloqueada temporalmente debido a varios intentos fallidos de inicio de sesión."
    unlock_text: "Tu cuenta se desbloqueará automáticamente en %{minutes} minutos."
    security_warning: "Si no fuiste tú, te recomendamos restablecer tu contraseña de inmediato para asegurar tu cuenta."
    button: "Restablecer contraseña"
