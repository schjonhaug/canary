_version: 1

# Common strings used across multiple providers
common:
  greeting: "Hi %{to_name},"
  footer: "This notification was sent by Canary"
  wallet: "Wallet"

# Transaction notification messages (message_formatter.rs)
transaction:
  receive:
    confirmed: "✅ Received: %{amount_btc} BTC to %{wallet_name}"
    pending: "💸 Receiving: %{amount_btc} BTC to %{wallet_name} (unconfirmed)"
    replaced: "🔄 Replaced: %{amount_btc} BTC to %{wallet_name} (replaced by %{short_txid})"
  send:
    confirmed_with_amount: "✅ Sent: %{amount_btc} BTC from %{wallet_name}"
    confirmed_no_amount: "✅ Sent from %{wallet_name}"
    pending: "📤 Sending: %{amount_btc} BTC from %{wallet_name}"
    replaced: "🔄 Replaced: %{amount_btc} BTC from %{wallet_name} (replaced by %{short_txid})"

# Balance alert messages (message_formatter.rs)
balance_alert:
  drain: "🚨 Wallet Drain Alert: %{wallet_name} balance is now 0 BTC"
  equals: "📊 Balance Alert: %{wallet_name} balance is now %{current_display}"
  above: "📊 Balance Alert: %{wallet_name} balance is now above %{threshold_display} (current: %{current_display})"
  below: "📊 Balance Alert: %{wallet_name} balance is now below %{threshold_display} (current: %{current_display})"

# Notification titles (used by email subjects and ntfy push titles)
titles:
  receive:
    pending: "Receiving Bitcoin"
    confirmed: "Bitcoin Received"
  send:
    pending: "Sending Bitcoin"
    confirmed: "Bitcoin Sent"
  balance_alert: "Balance Alert"

# Email template content (email_provider.rs)
email:
  transaction:
    header: "Bitcoin Transaction"
  balance_alert:
    header: "Balance Alert"
